{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Create a Listing</h2>
    <div class="create_listing">
        <form action="{% url 'create_listing' %}" method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <div class="form-group">
                    {{ field.errors }}
                    {{ field }}
                </div>
            {% endfor %}
            <input type="submit" class="btn btn-dark" value="Create Listing">
        </form>
    </div>
{% endblock %}
